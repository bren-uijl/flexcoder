[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexcoder"
version = "0.1.0"
description = "FlexCoder CLI assistant"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
flexcoder = "flexcoder.main:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["flexcoder*"]
